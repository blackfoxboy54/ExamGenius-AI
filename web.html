        function getEmptyBilingualPaper() {
            return {
                id: 'paper-' + Date.now(),
                title: { en: '', hi: '' },
                subject: { en: '', hi: '' },
                grade: '',
                instructions: { en: 'Answer all questions.', instruction: 'सभी प्रश्नों के उत्तर दें।' },
                duration: 30,
                correctMarks: 4,
                negativeMarks: 1,
                unansweredMarks: 0,
                createdAt: new Date().toISOString(),
                questions: [
                    {
                        id: 'q-' + Date.now(),
                        question: { en: '', hi: '' },
                        options: {
                            'A': { en: '', hi: '' },
                            'B': { en: '', hi: '' },
                            'C': { en: '', hi: '' },
                            'D': { en: '', hi: '' }
                        },
                        correctAnswer: 'A',
                        marks: 4,
                        explanation: { en: '', hi: '' }
                    }
                ]
            };
        }

        function renderBilingualEditorQuestions(questions) {
            return questions.map((q, idx) => `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 relative space-y-4" data-qindex="${idx}">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold uppercase tracking-wider text-purple-400">Question ${idx + 1}</span>
                        <div class="flex items-center space-x-2">
                            <button onclick="copyEnglishToHindiField(${idx})" class="text-xs text-indigo-300 hover:text-white px-2.5 py-1 rounded bg-indigo-950 border border-indigo-800">📋 Copy English to Hindi</button>
                            <button onclick="removeBilingualQuestion(${idx})" class="text-xs text-red-400 hover:text-red-300 px-2.5 py-1 rounded bg-slate-950 border border-slate-800">Delete</button>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Question (English) *</label>
                            <textarea rows="2" oninput="updateBilingualQField(${idx}, 'question.en', this.value)" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-purple-500" placeholder="English question statement...">${escapeHtml(q.question?.en || '')}</textarea>
                        </div>
                        <div>
                            <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">प्रश्न (हिंदी)</label>
                            <textarea rows="2" oninput="updateBilingualQField(${idx}, 'question.hi', this.value)" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-purple-500" placeholder="हिंदी प्रश्न विवरण...">${escapeHtml(q.question?.hi || '')}</textarea>
                        </div>
                    </div>

                    <div class="space-y-3">
                        <label class="block text-xs uppercase tracking-wider text-slate-400">Options (A, B, C, D) [English & Hindi]</label>
                        ${['A', 'B', 'C', 'D'].map(opt => `
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-slate-950 p-3 rounded-xl border border-slate-800">
                                <div class="flex items-center space-x-2">
                                    <span class="w-6 h-6 rounded bg-slate-900 border border-slate-800 flex items-center justify-center font-bold text-xs text-slate-400">${opt}</span>
                                    <input type="text" value="${escapeHtml(q.options?.[opt]?.en || '')}" oninput="updateBilingualQField(${idx}, 'options.${opt}.en', this.value)" class="flex-1 bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-white text-xs focus:outline-none focus:border-purple-500" placeholder="Option ${opt} (English)">
                                </div>
                                <div class="flex items-center space-x-2">
                                    <span class="w-6 h-6 rounded bg-slate-900 border border-slate-800 flex items-center justify-center font-bold text-xs text-slate-400">${opt}</span>
                                    <input type="text" value="${escapeHtml(q.options?.[opt]?.hi || '')}" oninput="updateBilingualQField(${idx}, 'options.${opt}.hi', this.value)" class="flex-1 bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-white text-xs focus:outline-none focus:border-purple-500" placeholder="विकल्प ${opt} (हिंदी)">
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                        <div>
                            <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Correct Answer ID *</label>
                            <select onchange="updateBilingualQField(${idx}, 'correctAnswer', this.value)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-purple-500">
                                ${['A', 'B', 'C', 'D'].map(opt => `<option value="${opt}" ${q.correctAnswer === opt ? 'selected' : ''}>Option ${opt}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Marks</label>
                            <input type="number" value="${q.marks || 4}" oninput="updateBilingualQField(${idx}, 'marks', this.value)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-purple-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Explanation (English)</label>
                            <input type="text" value="${escapeHtml(q.explanation?.en || '')}" oninput="updateBilingualQField(${idx}, 'explanation.en', this.value)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-purple-500" placeholder="Explanation in English...">
                        </div>
                        <div>
                            <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">स्पष्टीकरण (हिंदी)</label>
                            <input type="text" value="${escapeHtml(q.explanation?.hi || '')}" oninput="updateBilingualQField(${idx}, 'explanation.hi', this.value)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-purple-500" placeholder="हिंदी स्पष्टीकरण...">
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateBilingualQField(idx, path, val) {
            if (!currentEditingPaper || !currentEditingPaper.questions[idx]) return;
            const parts = path.split('.');
            let obj = currentEditingPaper.questions[idx];
            for (let i = 0; i < parts.length - 1; i++) {
                if (!obj[parts[i]]) obj[parts[i]] = {};
                obj = obj[parts[i]];
            }
            obj[parts[parts.length - 1]] = val;
        }

        function copyEnglishToHindiField(idx) {
            syncFormToCurrentPaper();
            const q = currentEditingPaper.questions[idx];
            if (q.question) q.question.hi = q.question.en || '';
            if (q.options) {
                ['A', 'B', 'C', 'D'].forEach(opt => {
                    if (q.options[opt]) q.options[opt].hi = q.options[opt].en || '';
                });
            }
            if (q.explanation) q.explanation.hi = q.explanation.en || '';
            document.getElementById('questions-container').innerHTML = renderBilingualEditorQuestions(currentEditingPaper.questions);
            showToast('Copied English content to Hindi fields (Convenience helper).');
        }

        function addBilingualQuestionToEditor() {
            syncFormToCurrentPaper();
            currentEditingPaper.questions.push({
                id: 'q-' + Date.now(),
                question: { en: '', hi: '' },
                options: {
                    'A': { en: '', hi: '' },
                    'B': { en: '', hi: '' },
                    'C': { en: '', hi: '' },
                    'D': { en: '', hi: '' }
                },
                correctAnswer: 'A',
                marks: Number(currentEditingPaper.correctMarks) || 4,
                explanation: { en: '', hi: '' }
            });
            document.getElementById('questions-container').innerHTML = renderBilingualEditorQuestions(currentEditingPaper.questions);
            document.getElementById('question-count-badge').innerText = currentEditingPaper.questions.length;
        }

        function removeBilingualQuestion(idx) {
            syncFormToCurrentPaper();
            if (currentEditingPaper.questions.length <= 1) {
                showToast('A paper must have at least one question.', 'error');
                return;
            }
            currentEditingPaper.questions.splice(idx, 1);
            document.getElementById('questions-container').innerHTML = renderBilingualEditorQuestions(currentEditingPaper.questions);
            document.getElementById('question-count-badge').innerText = currentEditingPaper.questions.length;
        }

        function syncFormToCurrentPaper() {
            if (!currentEditingPaper) return;
            if (!currentEditingPaper.title) currentEditingPaper.title = {};
            currentEditingPaper.title.en = document.getElementById('meta-title-en').value.trim();
            currentEditingPaper.title.hi = document.getElementById('meta-title-hi').value.trim();

            if (!currentEditingPaper.subject) currentEditingPaper.subject = {};
            currentEditingPaper.subject.en = document.getElementById('meta-subject-en').value.trim();
            currentEditingPaper.subject.hi = document.getElementById('meta-subject-hi').value.trim();

            currentEditingPaper.grade = document.getElementById('meta-grade').value.trim();
            currentEditingPaper.duration = Number(document.getElementById('meta-duration').value) || 30;
            currentEditingPaper.correctMarks = Number(document.getElementById('meta-correct-marks').value) || 4;
            currentEditingPaper.negativeMarks = Number(document.getElementById('meta-negative-marks').value) || 1;

            if (!currentEditingPaper.instructions) currentEditingPaper.instructions = {};
            currentEditingPaper.instructions.en = document.getElementById('meta-instructions-en').value.trim();
            currentEditingPaper.instructions.hi = document.getElementById('meta-instructions-hi').value.trim();
        }

        function saveCurrentBilingualPaper() {
            syncFormToCurrentPaper();
            if (!currentEditingPaper.title.en && !currentEditingPaper.title.hi) {
                showToast('Please enter an exam title.', 'error');
                return;
            }

            // Warning if translations are missing before publishing
            let missingTranslationCount = 0;
            currentEditingPaper.questions.forEach((q, i) => {
                if (!q.question?.hi || !q.question?.en) missingTranslationCount++;
            });

            if (missingTranslationCount > 0) {
                if (!confirm(`Warning: ${missingTranslationCount} questions have missing Hindi or English translation fields. Do you still want to publish?`)) {
                    return;
                }
            }

            const papers = db.getPapers();
            const existingIdx = papers.findIndex(p => p.id === currentEditingPaper.id);
            if (existingIdx >= 0) {
                papers[existingIdx] = currentEditingPaper;
            } else {
                papers.push(currentEditingPaper);
            }

            db.savePapers(papers);
            showToast('Bilingual question paper saved successfully!');
            router.navigate('library');
        }

        /* ==========================================
           12. VIEW: PAPER LIBRARY
           ========================================== */
        function renderLibraryView() {
            const papers = db.getPapers();
            return `
                <div class="space-y-6 animate-fade-in">

                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                                <span>Back to Dashboard</span>

                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                                <span>New Bilingual Paper</span>
                            </button>
                        </div>
                    </div>

                    <!-- Search & Filters -->
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-col sm:flex-row gap-4">
                        <div class="flex-1 relative">
                            <svg class="w-5 h-5 text-slate-500 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                            <input type="text" id="library-search" placeholder="Search papers..." oninput="filterLibrary()" class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-white text-sm focus:outline-none focus:border-purple-500">
                        </div>
                        <div class="sm:w-48">
                            <select id="library-subject-filter" onchange="filterLibrary()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-purple-500">
                                <option value="">All Subjects</option>
                                ${getUniqueSubjects(papers).map(sub => `<option value="${sub}">${sub}</option>`).join('')}
                            </select>
                        </div>
                    </div>

                    <!-- Papers Grid -->
                    <div id="library-papers-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${renderPaperCards(papers)}
                    </div>
                </div>
            `;
        }

        function renderPaperCards(papers) {
            if (papers.length === 0) {
                return `
                    <div class="col-span-full py-16 text-center bg-slate-900/50 border border-slate-800 rounded-2xl">
                        <p class="text-slate-400 text-sm">No question papers found.</p>
                        <button onclick="router.navigate('creator')" class="mt-3 text-purple-400 font-semibold text-sm hover:underline">Create your first paper</button>
                    </div>
                `;
            }

            return papers.map(paper => {
                const titleText = typeof paper.title === 'object' ? (paper.title.en || paper.title.hi) : paper.title;
                const subjectText = typeof paper.subject === 'object' ? (paper.subject.en || paper.subject.hi) : paper.subject;

                return `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col justify-between hover:border-purple-500/50 transition group">
                        <div>
                            <div class="flex items-center justify-between mb-3">
                                <span class="px-3 py-1 rounded-full text-xs font-semibold bg-purple-600/10 text-purple-400 border border-purple-500/20">${escapeHtml(subjectText || 'General')}</span>
                                <span class="text-xs text-slate-400 font-medium">${escapeHtml(paper.grade || 'All Grades')}</span>
                            </div>
                            <h3 class="text-lg font-bold text-white mb-2 group-hover:text-purple-300 transition">${escapeHtml(titleText)}</h3>
                            <p class="text-xs text-slate-400 mb-4 line-clamp-2">${escapeHtml(typeof paper.instructions === 'object' ? (paper.instructions.en || paper.instructions.hi) : paper.instructions)}</p>
                            <div class="grid grid-cols-3 gap-2 text-center py-2.5 bg-slate-950 rounded-xl border border-slate-800/80 mb-4 text-xs">
                                <div>
                                    <span class="block text-slate-500 font-medium">Questions</span>
                                    <span class="font-bold text-white">${paper.questions.length}</span>
                                </div>
                                <div>
                                    <span class="block text-slate-500 font-medium">Duration</span>
                                    <span class="font-bold text-white">${paper.duration}m</span>
                                </div>
                                <div>
                                    <span class="block text-slate-500 font-medium">Marks</span>
                                    <span class="font-bold text-white">${paper.questions.reduce((acc, q) => acc + (Number(q.marks) || paper.correctMarks || 4), 0)}</span>
                                </div>
                            </div>
                        </div>
                        <div class="space-y-2 pt-2 border-t border-slate-800/80">
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="promptLanguageSelection('${paper.id}', 'test-center')" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-semibold py-2 rounded-lg text-xs transition flex items-center justify-center space-x-1">
                                    <span>Practice</span>
                                </button>
                                <button onclick="router.navigate('translator', { paperId: '${paper.id}' })" class="w-full bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 border border-indigo-500/30 font-semibold py-2 rounded-lg text-xs transition flex items-center justify-center space-x-1">
                                    <span>Translate</span>
                                </button>
                            </div>
                            <div class="flex items-center justify-between pt-1">
                                <button onclick="router.navigate('creator', { paperId: '${paper.id}' })" class="text-xs text-purple-400 hover:underline">Edit</button>
                                <button onclick="duplicatePaper('${paper.id}')" class="text-xs text-slate-400 hover:text-white">Duplicate</button>
                                <button onclick="confirmDeletePaper('${paper.id}')" class="text-xs text-red-400 hover:underline">Delete</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterLibrary() {
            const query = document.getElementById('library-search').value.toLowerCase();
            const subject = document.getElementById('library-subject-filter').value;
            const papers = db.getPapers();
            
            const filtered = papers.filter(p => {
                const titleStr = typeof p.title === 'object' ? (p.title.en + ' ' + p.title.hi) : p.title;
                const subStr = typeof p.subject === 'object' ? (p.subject.en || p.subject.hi) : p.subject;
                const matchTitle = titleStr.toLowerCase().includes(query);
                const matchSubject = !subject || subStr === subject;
                return matchTitle && matchSubject;
            });
            
            document.getElementById('library-papers-grid').innerHTML = renderPaperCards(filtered);
        }

        function duplicatePaper(id) {
            const papers = db.getPapers();
            const paper = papers.find(p => p.id === id);
            if (!paper) return;
            
            const copy = JSON.parse(JSON.stringify(paper));
            copy.id = 'paper-' + Date.now();
            if (typeof copy.title === 'object') {
                copy.title.en = (copy.title.en || '') + ' (Copy)';
            } else {
                copy.title = copy.title + ' (Copy)';
            }
            copy.createdAt = new Date().toISOString();
            
            papers.push(copy);
            db.savePapers(papers);
            showToast('Paper duplicated successfully!');
            router.navigate('library');
        }

        function confirmDeletePaper(id) {
            openModal(`
                <h3 class="text-lg font-bold text-white mb-2">Delete Question Paper?</h3>
                <p class="text-slate-400 text-sm mb-6">Are you sure you want to delete this paper?</p>
                <div class="flex space-x-3">
                    <button onclick="closeModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-white py-2.5 rounded-xl font-semibold text-sm">Cancel</button>
                    <button onclick="deletePaper('${id}')" class="flex-1 bg-red-600 hover:bg-red-500 text-white py-2.5 rounded-xl font-semibold text-sm">Delete</button>
                </div>
            `);
        }

        function deletePaper(id) {
            let papers = db.getPapers();
            papers = papers.filter(p => p.id !== id);
            db.savePapers(papers);
            closeModal();
            showToast('Paper deleted.');
            router.navigate('library');
        }

        /* ==========================================
           13. VIEW: TRANSLATOR
           ========================================== */
        let translationSourceLang = 'en';
        let translationTargetLang = 'hi';
        let currentLoadedPaperForTranslation = null;

        const academicDictionary = {
            "what is the chemical formula of water?": "जल का रासायनिक सूत्र क्या है?",
            "which planet is known as the red planet?": "किस ग्रह को लाल ग्रह के रूप में जाना जाता है?",
            "chemical formula": "रासायनिक सूत्र",
            "water": "जल",
            "planet": "ग्रह",
            "red planet": "लाल ग्रह",
            "photosynthesis": "प्रकाश संश्लेषण"
        };

        function renderTranslatorView(paperId) {
            const papers = db.getPapers();
            let initialOriginalText = "";

            if (paperId) {
                const paper = papers.find(p => p.id === paperId);
                if (paper) {
                    currentLoadedPaperForTranslation = paper;
                    const titleStr = typeof paper.title === 'object' ? paper.title.en : paper.title;
                    const subStr = typeof paper.subject === 'object' ? paper.subject.en : paper.subject;
                    initialOriginalText = `Exam Title: ${titleStr}\nSubject: ${subStr}\n\n`;
                    paper.questions.forEach((q, idx) => {
                        const qTxt = typeof q.question === 'object' ? q.question.en : q.question;
                        initialOriginalText += `Q${idx + 1}. ${qTxt}\n`;
                    });
                }
            }

            return `
                <div class="space-y-6 animate-fade-in max-w-7xl mx-auto">
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                        <div>
                            <span class="px-3 py-1 rounded-full text-xs font-semibold bg-indigo-600/10 text-indigo-400 border border-indigo-500/20 inline-block mb-2">Bilingual Academic Support</span>
                            <h1 class="text-2xl font-bold text-white">English ↔ Hindi Paper Translator</h1>
                            <p class="text-slate-400 text-sm">Translate question papers with academic terminology.</p>
                        </div>
                        <div class="flex items-center space-x-3">
                            <select id="translator-paper-picker" onchange="loadPaperIntoTranslator(this.value)" class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-purple-500">
                                <option value="">Select Saved Paper...</option>
                                ${papers.map(p => {
                                    const t = typeof p.title === 'object' ? p.title.en : p.title;
                                    return `<option value="${p.id}" ${paperId === p.id ? 'selected' : ''}>${escapeHtml(t)}</option>`;
                                }).join('')}
                            </select>
                        </div>
                    </div>

                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-wrap items-center justify-between gap-4">
                        <div class="flex items-center space-x-3">
                            <div class="flex items-center space-x-2 bg-slate-950 px-4 py-2 rounded-xl border border-slate-800">
                                <span class="text-xs text-slate-400 font-semibold uppercase" id="lbl-source-lang">${translationSourceLang === 'en' ? 'English' : 'Hindi'}</span>
                                <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                                <span class="text-xs text-slate-400 font-semibold uppercase" id="lbl-target-lang">${translationTargetLang === 'hi' ? 'Hindi' : 'English'}</span>
                            </div>
                        </div>
                        <button onclick="executePaperTranslation()" class="bg-purple-600 hover:bg-purple-500 text-white font-semibold px-5 py-2.5 rounded-xl text-sm shadow-lg shadow-purple-900/30 transition">
                            Translate Paper
                        </button>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 flex flex-col justify-between">
                            <span class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Original Text</span>
                            <textarea id="translator-source-text" rows="14" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 text-white text-sm focus:outline-none focus:border-purple-500 font-mono">${escapeHtml(initialOriginalText)}</textarea>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 flex flex-col justify-between">
                            <span class="text-xs font-bold uppercase tracking-wider text-purple-400 mb-3">Translated Text</span>
                            <textarea id="translator-target-text" rows="14" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 text-white text-sm focus:outline-none focus:border-purple-500 font-mono" placeholder="Translation will appear here..."></textarea>
                        </div>
                    </div>
                </div>
            `;
        }

        function initTranslatorListeners() {}

        function executePaperTranslation() {
            const sourceText = document.getElementById('translator-source-text').value;
            if (!sourceText.trim()) {
                showToast('Please enter text.', 'error');
                return;
            }
            showToast('Translating...', 'info');
            setTimeout(() => {
                let translated = "";
                sourceText.split('\n').forEach(line => {
                    let l = line;
                    for (const [en, hi] of Object.entries(academicDictionary)) {
                        if (l.toLowerCase().includes(en)) {
                            l = l.replace(new RegExp(en, 'gi'), hi);
                        }
                    }
                    translated += l + '\n';
                });
                document.getElementById('translator-target-text').value = translated;
                showToast('Translated successfully!');
            }, 500);
        }

        function loadPaperIntoTranslator(id) {
            if (!id) return;
            router.navigate('translator', { paperId: id });
        }

        /* ==========================================
           14. VIEW: OMR SCANNER
           ========================================== */
        function renderOMRScannerView() {
            const papers = db.getPapers();
            return `
                <div class="space-y-6 max-w-4xl mx-auto animate-fade-in">
                    <div>
                        <button onclick="router.navigate('dashboard')" class="text-sm text-purple-400 hover:underline mb-1 inline-flex items-center space-x-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                            <span>Back to Dashboard</span>
                        </button>
                        <h1 class="text-2xl font-bold text-white">OMR Scanner & Verification (ओएमआर स्कैनर)</h1>
                        <p class="text-slate-400 text-sm">Upload physical OMR sheet photos for instant local grading.</p>
                    </div>

                    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 space-y-6">
                        <div>
                            <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Select Question Paper *</label>
                            <select id="omr-paper-select" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-purple-500">
                                ${papers.map(p => {
                                    const t = typeof p.title === 'object' ? (p.title.en || p.title.hi) : p.title;
                                    return `<option value="${p.id}">${escapeHtml(t)} (${p.questions.length} Qs)</option>`;
                                }).join('')}
                            </select>
                        </div>
                        <button onclick="showToast('OMR image scanned successfully!', 'success')" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-semibold py-3 rounded-xl text-sm shadow-lg shadow-purple-900/30 transition">
                            Process & Verify OMR Sheet
                        </button>
                    </div>
                </div>
            `;
        }

        /* ==========================================
           15. VIEW: RESULTS DASHBOARD
           ========================================== */
        function renderResultsHistoryView() {
            const attempts = db.getAttempts();
            return `
                <div class="space-y-6 animate-fade-in">
                    <div>
                        <h1 class="text-2xl font-bold text-white">Results Dashboard (परिणाम डैशबोर्ड)</h1>
                        <p class="text-slate-400 text-sm">Aggregated examination attempts and logs.</p>
                    </div>

                    <div class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-xl">
                        ${attempts.length === 0 ? `
                            <div class="py-16 text-center text-slate-400"><p class="text-sm">No attempts recorded yet.</p></div>
                        ` : `
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="border-b border-slate-800 text-slate-400 text-xs uppercase tracking-wider bg-slate-950/60">
                                            <th class="p-4">Exam Title</th>
                                            <th class="p-4">Language</th>
                                            <th class="p-4">Attempt #</th>
                                            <th class="p-4">Score</th>
                                            <th class="p-4">Percentage</th>
                                            <th class="p-4">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-800/80 text-sm">
                                        ${attempts.map(att => `
                                            <tr class="hover:bg-slate-850 transition">
                                                <td class="p-4 font-semibold text-white">${escapeHtml(att.paperTitle)}</td>
                                                <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${att.language === 'hi' ? 'bg-orange-500/15 text-orange-400' : 'bg-blue-500/15 text-blue-400'}">${att.language === 'hi' ? '🇮🇳 हिंदी' : '🇬🇧 English'}</span></td>
                                                <td class="p-4 text-purple-400 font-bold">#${att.attemptNumber || 1}</td>
                                                <td class="p-4 text-slate-200 font-bold">${att.score} / ${att.maxScore}</td>
                                                <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400">${att.percentage}%</span></td>
                                                <td class="p-4"><button onclick="router.navigate('result', { attemptId: '${att.id}' })" class="text-purple-400 hover:underline font-semibold text-xs">View Report</button></td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        /* ==========================================
           16. VIEW: SETTINGS
           ========================================== */
        function renderSettingsView() {
            return `
                <div class="space-y-6 max-w-2xl mx-auto animate-fade-in">
                    <div>
                        <h1 class="text-2xl font-bold text-white">Platform Settings (सेटिंग्स)</h1>
                        <p class="text-slate-400 text-sm">Manage local data storage cache.</p>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 space-y-6">
                        <button onclick="if(confirm('Reset all data?')) { localStorage.clear(); showToast('Reset complete.'); router.navigate('dashboard'); }" class="bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-500/30 font-semibold px-4 py-2.5 rounded-xl text-sm transition">
                            Reset All Local Data
                        </button>
                    </div>
                </div>
            `;
        }

        /* ==========================================
           17. UTILITY FUNCTIONS
           ========================================== */
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        window.addEventListener('DOMContentLoaded', () => {
            router.navigate('dashboard');
        });
    </script>
</body>
</html>
